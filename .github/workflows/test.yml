# Runs the engine's tests and builds the app, on a macOS runner, so a change can be
# checked without a Mac. Run it from the Actions tab.
name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # pipefail, or a failing `swift test` is hidden behind the filter after it.
      - name: Engine tests
        run: |
          set -o pipefail
          swift test 2>&1 | grep -E "error:|Executed [0-9]+ tests|Fatal|crash" | sort -u | tail -80

      - name: Build app and widget
        run: |
          set -o pipefail
          xcodebuild \
            -project SEPTACommute.xcodeproj \
            -scheme SEPTACommute \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" | sort -u | tail -60
